plugins {
    id 'com.google.gms.google-services' version '4.4.4' apply false
}

allprojects {
    repositories {
        // JitPack 放最前：腾讯镜像对部分构件（如 RecordWav）返回 200 空文件，会污染解析
        maven { url 'https://jitpack.io' }
        // 项目依赖用阿里云优先（速度快）；腾讯镜像兜底（阿里云个别路径 502）
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://mirrors.cloud.tencent.com/maven/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
    configurations.configureEach {
        resolutionStrategy {
            // integration_test 插件使用动态版本（1.2+），需联网查询 maven-metadata，
            // 部分网络下 mavenCentral 403 导致构建失败 —— 固定版本绕开动态解析
            force 'androidx.test:runner:1.6.2'
            force 'androidx.test:rules:1.6.1'
            force 'androidx.test.espresso:espresso-core:3.6.1'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
